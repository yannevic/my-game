<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet" />
    <title>my-game</title>
  </head>
  <body>
    <div id="game"></div>
        <div id="menu">
      <div class="palco">
        <img class="casal" src="/assets/menu/miya_kiss.png" alt="" />
        <div class="titulo">
          <h1>MiYa</h1>
          <p>a love story</p>
        </div>
        <nav class="botoes">
          <button class="botao" id="btn-novo">Novo jogo</button>
          <button class="botao" id="btn-continuar" disabled>Continuar</button>
          <button class="botao" id="btn-galeria">Galeria</button>
          <button class="botao" id="btn-extras">Extras</button>
          <button class="botao" id="btn-config">Configurações</button>
          <button class="botao" id="btn-sair">Sair</button>
        </nav>
      </div>
    </div>
            <div id="caixa-dialogo">
                    <img class="retrato" alt="" />
      <div class="conteudo">
        <div class="nome"></div>
        <div class="texto"></div>
      </div>
    </div>

        <div id="slots">
      <div class="diario">
        <img class="clamp" src="/assets/cozy-ui/diario_clamp.png" alt="" />
        <h2>Escolha um slot</h2>
        <div class="lista">
          <button class="slot"><i class="c c1"></i><i class="c c2"></i><i class="c c3"></i><i class="c c4"></i><img src="/assets/cozy-ui/mais.png" alt="" /></button>
          <button class="slot"><i class="c c1"></i><i class="c c2"></i><i class="c c3"></i><i class="c c4"></i><img src="/assets/cozy-ui/mais.png" alt="" /></button>
          <button class="slot"><i class="c c1"></i><i class="c c2"></i><i class="c c3"></i><i class="c c4"></i><img src="/assets/cozy-ui/mais.png" alt="" /></button>
        </div>
        <button class="botao" id="btn-voltar">Voltar</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
